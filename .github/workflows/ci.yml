name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: hashicorp/setup-terraform@v3  # only used for `init -backend=false` + `validate`
      - run: uv sync --python 3.12
      - run: make lint
      - run: make test
    # No GEMINI_API_KEY here on purpose: CI only uses fakes and recorded fixtures.
