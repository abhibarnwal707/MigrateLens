[project]
name = "migratelens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.14",
    "google-genai>=2.30,<3",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["eval/apps", "tests/fixtures"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools]
packages = ["migratelens"]

[tool.ruff.lint.per-file-ignores]
"eval/report.py" = ["E501"]  # long markdown string literals
